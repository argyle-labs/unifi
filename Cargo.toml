[package]
name = "unifi"
version = "0.1.0"
edition = "2021"
description = "UniFi Network controller integration — orca appliance backend"

[package.metadata.orca]
category = "networking"

[lib]
name = "unifi"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "unifi"
path = "src/main.rs"

# unifi is a DUAL-facet orca plugin: a ServiceBackend plus a read-only
# `unifi.` #[orca_tool] surface over the Integration API. Both facets resolve
# through `plugin_toolkit::*` alone.
#
# Thin profile: `delegated-http` retargets the HTTP client onto orca's
# `http.request` capability, so this plugin links NO reqwest/rustls/hyper.
[dependencies]
plugin-toolkit = { version = ">=0.2.1-rc.47", registry = "gitea", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "delegated-http"] }
serde     = { version = "1", features = ["derive"] }
schemars  = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
plugin-toolkit = { version = ">=0.2.1-rc.47", registry = "gitea", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "delegated-http"] }
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints.clippy]
let_underscore_must_use = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
